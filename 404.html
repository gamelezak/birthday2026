<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Страница не найдена… но праздник рядом!</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .lost-card {
      max-width: 560px; margin: 20vh auto; padding: 36px 28px; text-align: center;
      background: rgba(20, 10, 40, .72); color: #fff; border-radius: 18px;
      font-family: 'Courier New', monospace; box-shadow: 0 0 40px rgba(255,180,80,.25);
    }
    .lost-card h1 { font-size: 22px; margin-bottom: 14px; color: #ffd98a; }
    .lost-card p { line-height: 1.6; margin-bottom: 22px; }
    .lost-card a.btn404 {
      display: inline-block; padding: 12px 22px; border-radius: 10px; text-decoration: none;
      background: linear-gradient(135deg, #ff6db3, #ffb347); color: #1a0b2e; font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="lost-card">
    <h1>Упс! Такой страницы нет…</h1>
    <p>Возможно, вы искали страницу с поздравлением?<br/>Проверяйте, что в репозитории на GitHub Pages
       опубликован файл <b>congrats.html</b> (он должен лежать рядом с index.html).</p>
    <p id="countdown404">Вернём вас к таймеру через 5 секунд…</p>
    <a class="btn404" href="./index.html">К ТАЙМЕРУ ДО 19-ЛЕТИЯ</a>
  </main>
  <script>
    // если забрели сюда — тихо уводим на главную (учитывая подпадок GitHub Pages)
    setTimeout(function () {
      var base = location.pathname.replace(/[^/]*$/, '');
      location.replace(base + 'index.html');
    }, 5000);
  </script>
</body>
</html>
