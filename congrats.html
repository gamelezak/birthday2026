<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffb347" />
  <title>С Днём Рождения!</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="congrats.css" />
</head>
<body class="party-body">
  <main class="party-scene" id="partyScene" aria-label="Поздравление с днём рождения">
    <div class="backgrounds" aria-hidden="true">
      <div class="background-layer background-party is-active"></div>
    </div>

    <canvas id="fireworks" class="fireworks" aria-hidden="true"></canvas>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="confetti-layer" id="confetti" aria-hidden="true"></div>
    <div class="balloon-layer" id="balloons" aria-hidden="true"></div>

    <!-- декор: гирлянды и флажки -->
    <div class="deco" aria-hidden="true">
      <img class="garland garland-top" src="assets/garland.png" alt="" draggable="false" />
      <img class="bunting bunting-left"  src="assets/bunting-side.png" alt="" draggable="false" />
      <img class="bunting bunting-right" src="assets/bunting-side.png" alt="" draggable="false" />
      <span class="spark sp1">✦</span>
      <span class="spark sp2">✧</span>
      <span class="spark sp3">✦</span>
      <span class="spark sp4">✧</span>
      <span class="spark sp5">✦</span>
    </div>

    <section class="party-card" id="partyCard">
      <img class="card-sign" src="assets/sign-hbd.png" alt="С Днём Рождения!" draggable="false" />
      <div class="badge bounce-badge">✦ ✨ ПРАЗДНИК НАСТУПИЛ! ✨ ✦</div>

      <h1 class="party-title" id="partyTitle" aria-label="С Днём Рождения!">
        <span class="ltr" style="--i:0">С</span>
        <span class="ltr" style="--i:1">&nbsp;</span>
        <span class="ltr" style="--i:2">Д</span>
        <span class="ltr" style="--i:3">Н</span>
        <span class="ltr" style="--i:4">Ё</span>
        <span class="ltr" style="--i:5">М</span>
        <span class="ltr" style="--i:6">&nbsp;</span>
        <span class="ltr" style="--i:7">Р</span>
        <span class="ltr" style="--i:8">О</span>
        <span class="ltr" style="--i:9">Ж</span>
        <span class="ltr" style="--i:10">Д</span>
        <span class="ltr" style="--i:11">Е</span>
        <span class="ltr" style="--i:12">Н</span>
        <span class="ltr" style="--i:13">И</span>
        <span class="ltr" style="--i:14">Я</span>
        <span class="ltr bang" style="--i:15">!</span>
      </h1>

      <p class="party-sub" id="typedWish"></p>

      <div class="cake-wrap" aria-hidden="true">
        <div class="cake">
          <img class="cake-img" src="assets/cake-lit.png" alt="" draggable="false" />
          <img class="cake-img blown-layer" src="assets/cake-blown.png" alt="" draggable="false" />
          <span class="smoke-spot s0"></span>
          <span class="smoke-spot s1"></span>
          <span class="smoke-spot s2"></span>
        </div>
        <p class="blow-hint" id="blowHint">★ Кликни по торту — задумай желание и задуй свечи ★</p>
      </div>

      <div class="wish-scroll hidden" id="wishScroll">
        <p>🎂 ЖЕЛАНИЕ ЗАДУМАНО! 🎂</p>
        <p>Пусть этот год будет самым ярким!<br/>Счастья, смеха и чудес — без границ!</p>
        <button class="btn btn-restart" id="relightBtn">☄ Зажечь свечи снова</button>
      </div>

      <div class="party-actions">
        <button class="btn btn-surprise" id="surpriseBtn">🎁 СУПЕР-СЮРПРИЗ</button>
        <button class="btn btn-back" id="backBtn">↩ ВСПОМНИТЬ ОЖИДАНИЕ</button>
      </div>
    </section>

    <footer>сделано с <span class="beat">❤</span> и фейерверками</footer>
  </main>

  <script src="congrats.js"></script>
</body>
</html>
